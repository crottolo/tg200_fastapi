# Nixpacks configuration for Coolify deployment
# FastAPI default port is 8000
# IMPORTANT: In Coolify UI, set "Ports Exposes" to 8000 in Network section

[phases.setup]
nixPkgs = ["python312", "python312Packages.pip"]

[phases.install]
cmds = ["pip install -r requirements.txt"]

[phases.build]
cmds = []

[start]
cmd = "uvicorn main:app --host 0.0.0.0 --port 8000"
