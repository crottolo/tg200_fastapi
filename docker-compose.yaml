version: '3.8'

services:
  tg200-api:
    build: .
    ports:
      - "8000:8000"
    restart: unless-stopped
    environment:
      # TG200 Gateway Configuration (REQUIRED)
      - TG200_HOST=${TG200_HOST:?TG200_HOST=37.117.57.200}
      - TG200_PORT=${TG200_PORT:-5038}
      - TG200_USERNAME=${TG200_USERNAME:?TG200_USERNAME=apiuser}
      - TG200_PASSWORD=${TG200_PASSWORD:?TG200_PASSWORD=apipass}
      - TG200_DEFAULT_SPAN=${TG200_DEFAULT_SPAN:-2}

      # API Security (REQUIRED - change in Coolify UI!)
      - API_BEARER_TOKEN=${API_BEARER_TOKEN:?API_BEARER_TOKEN=your-secret-token-here}

      # Webhook Configuration (REQUIRED)
      - WEBHOOK_URL=${WEBHOOK_URL:?WEBHOOK_URL=https://your-webhook-endpoint.com/webhook}
      - WEBHOOK_ENABLED=${WEBHOOK_ENABLED:-true}

      # Webhook Advanced Configuration (OPTIONAL with defaults)
      - WEBHOOK_TIMEOUT=${WEBHOOK_TIMEOUT:-5.0}
      - WEBHOOK_RETRY=${WEBHOOK_RETRY:-0}
      - WEBHOOK_SEND_ALL_EVENTS=${WEBHOOK_SEND_ALL_EVENTS:-true}
      - WEBHOOK_SEND_KEEPALIVE=${WEBHOOK_SEND_KEEPALIVE:-true}

    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
